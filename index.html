<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Local Engine AI Workstation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Transformers.js -->
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
    <style>
        html, body { background-color: #090d16 !important; color: #f1f5f9 !important; height: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-cyber-950 text-slate-100 h-screen flex flex-col font-sans selection:bg-emerald-500/30">

    <!-- Fejléc -->
    <header class="bg-cyber-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-sm font-bold font-mono uppercase text-emerald-400">NEXUS v4.3 // Manual Load</h1>
            <p class="text-[10px] text-slate-400" id="current-topic-display">Téma: Nincs kiválasztva</p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleSettings()" class="bg-slate-800 p-2 rounded-lg text-xs font-mono">Beállítások</button>
            <button onclick="toggleDebugModal()" class="bg-amber-950 p-2 rounded-lg text-xs font-mono text-amber-300">Napló</button>
        </div>
    </header>

    <!-- Beállító Panel -->
    <div id="settings-panel" class="hidden bg-cyber-900 p-4 space-y-4">
        <button onclick="initLocalTranslators()" class="w-full bg-emerald-700 hover:bg-emerald-600 p-3 rounded-lg text-sm font-bold">
            📁 Helyi Fordító Modellek Letöltése (Manuális)
        </button>
        <div id="load-progress" class="text-xs font-mono text-cyan-400 italic">Várakozás...</div>
        <input type="password" id="groq-key" placeholder="Groq API Key" class="w-full bg-cyber-950 p-2 rounded text-xs font-mono">
        <button onclick="saveKeys()" class="w-full bg-emerald-600 p-2 rounded text-sm">Mentés</button>
    </div>

    <div id="debug-modal" class="hidden fixed inset-0 bg-black/80 p-4 z-50 overflow-y-auto">
        <button onclick="toggleDebugModal()" class="text-white">Bezárás</button>
        <div id="debug-log-container" class="font-mono text-xs text-slate-300"></div>
    </div>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

    <footer class="p-4 border-t border-slate-800">
        <textarea id="user-input" rows="1" placeholder="Írd ide a kérdésed..." class="w-full bg-cyber-900 border border-slate-700 rounded-lg p-2 text-sm"></textarea>
        <button onclick="handleSend()" class="w-full bg-emerald-600 mt-2 p-2 rounded font-bold">Küldés</button>
    </footer>

    <script>
        let currentTopic = null;
        let db = null;
        let translatorHuEn = null;
        let translatorEnHu = null;

        // Init DB
        function initDB() {
            const request = indexedDB.open("NEXUS_DB", 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore("topics", { keyPath: "id" });
            request.onsuccess = (e) => { db = e.target.result; };
        }

        async function initLocalTranslators() {
            if (translatorHuEn && translatorEnHu) return;
            
            const progress = document.getElementById("load-progress");
            progress.innerText = "Modellek letöltése folyamatban... (ez eltarthat 1-2 percig)";
            addLog("INFO", "Letöltés indult...");

            try {
                const { pipeline, env } = window.Xenova;
                env.allowLocalModels = false;

                translatorHuEn = await pipeline('translation', 'Xenova/opus-mt-hu-en', {
                    progress_callback: p => progress.innerText = `HU-EN: ${Math.round(p.progress || 0)}%`
                });
                translatorEnHu = await pipeline('translation', 'Xenova/opus-mt-en-hu', {
                    progress_callback: p => progress.innerText = `EN-HU: ${Math.round(p.progress || 0)}%`
                });

                progress.innerText = "Sikeresen betöltve!";
                addLog("SUCCESS", "Modellek készen állnak.");
            } catch (err) {
                addLog("ERROR", "Letöltési hiba", err.message);
                progress.innerText = "Hiba! Nézd meg a naplót.";
            }
        }

        async function translateTextLocal(text, fromLang, toLang) {
            if (fromLang === "hu" && toLang === "en" && translatorHuEn) {
                const out = await translatorHuEn(text);
                return out[0].translation_text;
            }
            if (fromLang === "en" && toLang === "hu" && translatorEnHu) {
                const out = await translatorEnHu(text);
                return out[0].translation_text;
            }
            return "[FORDÍTÁS BETÖLTÉSE FOLYAMATBAN...]";
        }

        function appendMessage(sender, text, enText = null) {
            const chatBox = document.getElementById("chat-box");
            const isUser = sender === "Felhasználó";
            chatBox.innerHTML += `
                <div class="${isUser ? 'text-right' : 'text-left'} p-2">
                    <div class="inline-block p-3 rounded-lg ${isUser ? 'bg-emerald-900' : 'bg-slate-800'}">
                        <div>${text}</div>
                        ${enText ? `<div class="text-[10px] text-emerald-400 mt-2 border-t border-emerald-800 pt-1">🇬🇧 EN: ${enText}</div>` : ''}
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            appendMessage("Felhasználó", text, "[FORDÍTÁS FOLYAMATBAN...]");
            
            // Fordítás
            const en = await translateTextLocal(text, "hu", "en");
            
            // Frissítsük a buborékot az igazi fordítással
            if (en !== "[FORDÍTÁS BETÖLTÉSE FOLYAMATBAN...]") {
                // A legegyszerűbb: újraírjuk a chatet vagy frissítjük a DOM-ot
                // Ebben a v4.3 verzióban mostantól közvetlenül frissítjük:
                const lastMsg = document.querySelector("#chat-box > div:last-child div div:last-child");
                lastMsg.innerText = `🇬🇧 EN: ${en}`;
            }

            // AI hívás (Groq/Pollinations)
            // ... (ide a már megszokott executeSmartPipeline hívások) ...
        }

        function addLog(l, m) { document.getElementById("debug-log-container").innerHTML += `<div>[${l}] ${m}</div>`; }
        function toggleSettings() { document.getElementById("settings-panel").classList.toggle("hidden"); }
        function toggleDebugModal() { document.getElementById("debug-modal").classList.toggle("hidden"); }
        function saveKeys() { /* ... */ }

        document.addEventListener("DOMContentLoaded", initDB);
    </script>
</body>
</html>
