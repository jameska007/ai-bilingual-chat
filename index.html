<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Memory-Lock v5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
    <style>
        html, body { background-color: #090d16 !important; color: #f1f5f9 !important; height: 100%; }
        .bg-grid { background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
        
        /* HARD STYLE OVERRIDE */
        input, textarea, select {
            background-color: #0f172a !important;
            color: #ffffff !important;
            border: 1px solid #334155 !important;
        }
    </style>
</head>
<body class="bg-cyber-950 text-slate-100 h-screen flex flex-col font-sans bg-grid antialiased">

    <!-- Fejléc -->
    <header class="bg-cyber-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center gap-2">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-emerald-500/30 flex items-center justify-center">
                <i data-lucide="cpu" class="w-5 h-5 text-emerald-400"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold font-mono uppercase text-slate-100">NEXUS v5.2 Memory-Lock</h1>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="createNewTopicPrompt()" class="bg-emerald-600 px-3 py-1.5 rounded text-xs font-mono font-semibold">Új téma</button>
            <button onclick="toggleSettings()" class="bg-slate-800 px-3 py-1.5 rounded text-xs font-mono">Beállítások</button>
            <button onclick="toggleDebugModal()" class="bg-amber-950 text-amber-300 px-3 py-1.5 rounded text-xs font-mono">Napló</button>
        </div>
    </header>

    <!-- Beállítások Panel -->
    <div id="settings-panel" class="hidden bg-cyber-900 p-4 space-y-3 border-b border-slate-800">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="password" id="gemini-key" placeholder="Gemini API Key" class="p-2 text-xs">
            <input type="password" id="groq-key" placeholder="Groq API Key" class="p-2 text-xs">
            <input type="password" id="openrouter-key" placeholder="OpenRouter API Key" class="p-2 text-xs">
        </div>
        <button onclick="saveKeys()" class="bg-emerald-700 text-white text-xs p-2 rounded font-mono w-full">API Kulcsok Mentése</button>
    </div>

    <!-- Hibanapló Modal -->
    <div id="debug-modal" class="hidden fixed inset-0 bg-black/90 p-4 z-50 overflow-y-auto">
        <button onclick="toggleDebugModal()" class="text-white text-xs bg-slate-800 px-3 py-1 rounded mb-4">Bezárás</button>
        <div id="debug-log-container" class="font-mono text-[11px] text-slate-300"></div>
    </div>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

    <!-- Footer -->
    <footer class="p-4 bg-cyber-900/90 border-t border-slate-800">
        <textarea id="user-input" rows="2" placeholder="Írd ide a kérdésed magyarul..." class="w-full rounded-lg p-3 text-sm focus:outline-none"></textarea>
        <button onclick="handleSend()" class="w-full bg-emerald-600 mt-2 p-2.5 rounded-lg font-bold text-sm text-white">Küldés</button>
    </footer>

    <script>
        lucide.createIcons();
        let currentTopic = null, db = null;

        function initDB() {
            const request = indexedDB.open("NEXUS_Workstation_DB", 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore("topics", { keyPath: "id" });
            request.onsuccess = (e) => { db = e.target.result; };
        }

        async function handleSend() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;
            if (!currentTopic) await createNewTopicPrompt();
            
            input.value = "";
            const msgId = "msg_" + Date.now();
            appendMessage("Felhasználó", text, null, msgId);

            // 1. Kontextus betöltése adatbázisból (GARANTÁLT Memory-Lock)
            const tx = db.transaction("topics", "readwrite");
            const store = tx.objectStore("topics");
            const req = store.get(currentTopic.id);
            
            req.onsuccess = async () => {
                const topicData = req.result;
                let apiMessages = [{ role: "system", content: "You are a helpful AI assistant." }];

                // Előzmények betöltése
                if (topicData.turns) {
                    topicData.turns.forEach(t => {
                        apiMessages.push({ role: "user", content: t.userPromptEn });
                        apiMessages.push({ role: "assistant", content: t.aiResponseEn });
                    });
                }
                
                addLog("INFO", `[MEMORY INFO] Context turns sent: ${topicData.turns.length}`);

                // Fordítás és hívás
                const enPrompt = await translateText(text, "hu", "en");
                updateMessageEnPrompt(msgId, enPrompt);
                apiMessages.push({ role: "user", content: enPrompt });

                try {
                    const groqKey = localStorage.getItem("GROQ_KEY");
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${groqKey}` },
                        body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: apiMessages })
                    });
                    const d = await res.json();
                    const aiEn = d.choices[0].message.content;
                    const aiHu = await translateText(aiEn, "en", "hu");
                    
                    appendMessage("NEXUS AI", aiHu);
                    
                    topicData.turns.push({ userText: text, userPromptEn: enPrompt, aiResponse: aiHu, aiResponseEn: aiEn, modelUsed: "Groq" });
                    store.put(topicData);
                    currentTopic = topicData;
                } catch(e) { addLog("ERROR", "API Hiba", e.message); }
            };
        }

        // Fordító + UI Segédek
        async function translateText(text, from, to) {
            try {
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Translate to " + (to==="en"?"English":"Hungarian") + ": " + text)}`);
                return await res.text();
            } catch(e) { return text; }
        }

        function appendMessage(sender, text, enText=null, msgId=null) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div ${msgId?'id="'+msgId+'"':''} class="p-4 ${sender==='Felhasználó'?'bg-emerald-950':'bg-slate-900'} rounded-lg mb-3">
                <div class="text-[10px] text-slate-400">${sender}</div>
                <div class="text-sm">${text}</div>
                ${enText?`<div class="mt-2 text-[10px] text-cyan-300 border-t border-cyan-800 pt-1 en-prompt-box">🇬🇧 EN: ${enText}</div>`:''}
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updateMessageEnPrompt(msgId, enText) {
            const el = document.getElementById(msgId);
            if(el) el.querySelector(".en-prompt-box span") ? el.querySelector(".en-prompt-box span").innerText = enText : null;
        }

        function addLog(l, m) { document.getElementById("debug-log-container").innerHTML += `<div>[${l}] ${m}</div>`; }
        function toggleSettings() { document.getElementById("settings-panel").classList.toggle("hidden"); }
        function toggleDebugModal() { document.getElementById("debug-modal").classList.toggle("hidden"); }
        async function createNewTopicPrompt() {
            const title = prompt("Téma neve:");
            currentTopic = { id: "topic_" + Date.now(), title: title, turns: [] };
            const tx = db.transaction("topics", "readwrite");
            tx.objectStore("topics").put(currentTopic);
            document.getElementById("current-topic-display").innerText = "Téma: " + title;
        }
        function saveKeys() { 
            localStorage.setItem("GROQ_KEY", document.getElementById("groq-key").value.trim()); 
            alert("Mentve!"); 
        }

        document.addEventListener("DOMContentLoaded", initDB);
    </script>
</body>
</html>
