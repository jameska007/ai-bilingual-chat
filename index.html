<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Stable v4.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
    <style>
        html, body { background-color: #090d16 !important; color: #f1f5f9 !important; height: 100%; }
        .hidden { display: none !important; }
        .bg-grid { background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); }
    </style>
</head>
<body class="bg-cyber-950 text-slate-100 h-screen flex flex-col font-sans bg-grid antialiased">

    <!-- Fejléc -->
    <header class="bg-cyber-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center gap-2">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-emerald-500/30 flex items-center justify-center">
                <i data-lucide="cpu" class="w-5 h-5 text-emerald-400"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold font-mono uppercase text-slate-100">NEXUS v4.4</h1>
                <p class="text-[10px] text-slate-400" id="current-topic-display">Téma: Nincs kiválasztva</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="createNewTopicPrompt()" class="bg-emerald-600 px-3 py-1.5 rounded text-xs font-mono">Új téma</button>
            <select id="recent-topics-select" onchange="switchTopic(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded px-2 py-1.5 font-mono max-w-[120px]">
                <option value="">📁 Recent...</option>
            </select>
            <button onclick="toggleSettings()" class="bg-slate-800 px-3 py-1.5 rounded text-xs font-mono">Beállítások</button>
            <button onclick="toggleDebugModal()" class="bg-amber-950 text-amber-300 px-3 py-1.5 rounded text-xs font-mono">Napló</button>
        </div>
    </header>

    <!-- Beállítások Panel -->
    <div id="settings-panel" class="hidden bg-cyber-900 p-4 space-y-3 border-b border-slate-800">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="password" id="gemini-key" placeholder="Gemini API Key" class="bg-cyber-950 border border-slate-800 rounded p-2 text-xs">
            <input type="password" id="groq-key" placeholder="Groq API Key" class="bg-cyber-950 border border-slate-800 rounded p-2 text-xs">
            <input type="password" id="openrouter-key" placeholder="OpenRouter API Key" class="bg-cyber-950 border border-slate-800 rounded p-2 text-xs">
        </div>
        <div class="flex gap-2">
            <button onclick="initLocalTranslators()" class="bg-blue-900 text-xs p-2 rounded">Fordító letöltése</button>
            <button onclick="saveKeys()" class="bg-emerald-700 text-xs p-2 rounded">Mentés</button>
            <button onclick="exportCurrentToObsidian()" class="bg-purple-800 text-xs p-2 rounded">Mentés Obsidianba</button>
        </div>
        <div id="load-progress" class="text-[10px] text-cyan-400 font-mono"></div>
    </div>

    <!-- Hibanapló Modal -->
    <div id="debug-modal" class="hidden fixed inset-0 bg-black/90 p-4 z-50 overflow-y-auto">
        <button onclick="toggleDebugModal()" class="text-white mb-4">Bezárás</button>
        <div id="debug-log-container" class="font-mono text-[10px] text-slate-300"></div>
    </div>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4"></main>

    <!-- Footer -->
    <footer class="p-4 bg-cyber-900/90 border-t border-slate-800">
        <textarea id="user-input" rows="2" placeholder="Írd ide a kérdésed..." class="w-full bg-cyber-950 border border-slate-700 rounded-lg p-3 text-sm"></textarea>
        <button onclick="handleSend()" class="w-full bg-emerald-600 mt-2 p-2 rounded font-bold text-sm">Küldés</button>
    </footer>

    <script>
        lucide.createIcons();
        let currentTopic = null, db = null, logHistory = [], translatorHuEn = null, translatorEnHu = null;

        // --- ADATBÁZIS ÉS INITIALIZÁLÁS ---
        function initDB() {
            const request = indexedDB.open("NEXUS_Workstation_DB", 1);
            request.onupgradeneeded = (e) => e.target.result.createObjectStore("topics", { keyPath: "id" });
            request.onsuccess = (e) => { db = e.target.result; refreshRecentTopicsList(); };
        }
        
        // --- FORDÍTÓ MOTOR (Hybrid: Local + Fallback) ---
        async function initLocalTranslators() {
            const progress = document.getElementById("load-progress");
            progress.innerText = "Letöltés indult...";
            try {
                const { pipeline } = window.Xenova;
                translatorHuEn = await pipeline('translation', 'Xenova/opus-mt-hu-en');
                translatorEnHu = await pipeline('translation', 'Xenova/opus-mt-en-hu');
                progress.innerText = "Helyi fordító aktív!";
            } catch (err) {
                progress.innerText = "Helyi fordító hiba, online mód aktív.";
                addLog("WARN", "Helyi fordító hiba", err.message);
            }
        }

        async function translateText(text, fromLang, toLang) {
            if (fromLang === "hu" && toLang === "en" && translatorHuEn) return (await translatorHuEn(text))[0].translation_text;
            if (fromLang === "en" && toLang === "hu" && translatorEnHu) return (await translatorEnHu(text))[0].translation_text;
            
            // Fallback
            try {
                const res = await fetch(`https://lingva.ml/api/v1/${fromLang}/${toLang}/${encodeURIComponent(text)}`);
                return (await res.json()).translation || text;
            } catch (e) { return text; }
        }

        // --- LOGIKA ---
        async function handleSend() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;
            if (!currentTopic) await createNewTopicPrompt();
            
            input.value = "";
            const enPrompt = await translateText(text, "hu", "en");
            appendMessage("Felhasználó", text, enPrompt);

            // AI Hívás (Groq/Pollinations)
            try {
                const groqKey = localStorage.getItem("GROQ_KEY");
                let aiResponseEn = "";
                let modelUsed = "";

                if (groqKey) {
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${groqKey}` },
                        body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: enPrompt }] })
                    });
                    const d = await res.json();
                    aiResponseEn = d.choices[0].message.content;
                    modelUsed = "Groq (Llama 3.3)";
                } else {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(enPrompt)}`);
                    aiResponseEn = await res.text();
                    modelUsed = "Pollinations (Keyless)";
                }

                const aiResponseHu = await translateText(aiResponseEn, "en", "hu");
                appendMessage("NEXUS AI (" + modelUsed + ")", aiResponseHu);
                
                currentTopic.turns.push({ timestamp: new Date().toLocaleString(), userText: text, userPromptEn: enPrompt, aiResponse: aiResponseHu, modelUsed: modelUsed });
                saveTopicToDB(currentTopic);
            } catch (e) { addLog("ERROR", "Hiba", e.message); }
        }

        function appendMessage(sender, text, enText = null) {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="p-4 ${sender === 'Felhasználó' ? 'bg-emerald-950' : 'bg-slate-800'} rounded-lg">
                <div class="text-xs text-slate-400 mb-1">${sender}</div>
                <div>${text}</div>
                ${enText ? `<div class="text-[10px] text-cyan-400 mt-2 border-t border-cyan-800 pt-1">🇬🇧 EN: ${enText}</div>` : ''}
            </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- Segédek ---
        function toggleSettings() { document.getElementById("settings-panel").classList.toggle("hidden"); }
        function toggleDebugModal() { document.getElementById("debug-modal").classList.toggle("hidden"); }
        function addLog(l, m) { document.getElementById("debug-log-container").innerHTML += `<div>[${l}] ${m}</div>`; }
        function saveTopicToDB(topic) { const tx = db.transaction("topics", "readwrite"); tx.objectStore("topics").put(topic); }
        async function createNewTopicPrompt() {
            const title = prompt("Téma neve:");
            if (!title) return;
            currentTopic = { id: "topic_" + Date.now(), title: title, createdAt: new Date().toISOString(), turns: [] };
            saveTopicToDB(currentTopic);
            document.getElementById("current-topic-display").innerText = "Téma: " + title;
        }
        function saveKeys() {
            localStorage.setItem("GROQ_KEY", document.getElementById("groq-key").value.trim());
            alert("Kulcsok mentve!");
        }

        document.addEventListener("DOMContentLoaded", initDB);
    </script>
</body>
</html>
